# This is a Databricks asset bundle definition for databricks_claude_code_ao_vivo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: databricks_claude_code_ao_vivo
  uuid: 05568484-4c83-4ea8-a7de-53af02c4eb79

include:
  - resources/*.yml

# In dev mode, DABs would otherwise prefix UC schema names with "dev_<user>_" to
# avoid collisions when several developers share a catalog. We want the exact
# schema names (bronze/silver/gold) in every environment, so that's disabled here.
experimental:
  skip_name_prefix_for_schema: true

# Variable declarations. These variables are assigned in the dev/prod targets below.
# The catalog is the ONLY thing that differs between dev and prod. It must never be
# hardcoded anywhere else (YAML or SQL) — everything else derives from this variable.
variables:
  catalog:
    description: The Unity Catalog catalog that hosts the bronze/silver/gold schemas
  warehouse_id:
    description: SQL warehouse used to run the AI/BI dashboard
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-0084980a-6974.cloud.databricks.com
    variables:
      catalog: bakehouse_dev
    resources:
      pipelines:
        bakehouse_medallion:
          development: true
  prod:
    mode: production
    workspace:
      host: https://dbc-0084980a-6974.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mateusvbkasuya@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/${bundle.name}
    variables:
      catalog: bakehouse
    permissions:
      - user_name: mateusvbkasuya@gmail.com
        level: CAN_MANAGE
      - service_principal_name: e8f6a483-affd-404c-ab06-4f68d4372656
        level: CAN_MANAGE
