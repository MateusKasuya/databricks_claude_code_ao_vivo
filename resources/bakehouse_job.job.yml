# Orchestrates the Bakehouse medallion pipeline.
resources:
  jobs:
    bakehouse_medallion_job:
      name: databricks_claude_code_ao_vivo_bakehouse_medallion_job
      tasks:
        - task_key: run_bakehouse_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.bakehouse_medallion.id}
      permissions:
        - level: CAN_VIEW
          group_name: users
